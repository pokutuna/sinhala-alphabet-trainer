name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npx biome lint --reporter=github .
        continue-on-error: true
      - run: npm run build
